    <body data-bs-theme="dark">

        <!-- Event Manager -->

        <!-- Event Creation -->

                    <!-- Modal Body -->

                                <label for="eventTitle">
                                    Title

                                </label>
                                <input type="text" class="form-control" id="eventTitle" name="title" required />
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventDescription">
                                    Description
                                    <span class="text-danger">*</span>
                                </label>
                                <textarea class="form-control" id="eventDescription" name="description" rows="2" required></textarea>
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventStart">
                                    Start
                                    <span class="text-danger">*</span>
                                </label>
                                <input type="datetime-local" class="form-control" id="eventStart" name="start" required />
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventEnd">End</label>
                                <input type="datetime-local" class="form-control" id="eventEnd" name="end" />
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventAllDay">All Day</label>
                                <select class="form-control" id="eventAllDay" name="allDay">
                                    <option value="false" selected>No</option>
                                    <option value="true">Yes</option>
                                </select>
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventColor">Event Color</label>
                                <input type="color" class="form-control form-control-color" id="eventColor" name="color" value="#3788d8" />
                            </div>
                            <div class="form-group mb-2">
                                <label for="eventUrl">Event URL</label>
                                <input type="url" class="form-control" id="eventUrl" name="url" />
                            </div>

                            <!-- Advanced Settings Dropdown -->
                            <div class="form-group mb-2">
                                <button class="btn btn-link p-0" type="button" data-bs-toggle="collapse" data-bs-target="#advancedSettingsCollapse" aria-expanded="false" aria-controls="advancedSettingsCollapse">Show Advanced Fields</button>
                            </div>

                            <!-- Collapsible Advanced Settings -->

                                <div class="card card-body">

                                    </div>

                                        <label>Select Days of the Week</label>
                                        <div id="daysOfWeekButtons" class="btn-group btn-group-toggle mb-2" data-bs-toggle="buttons">
                                            <input type="checkbox" id="eventDaysOfWeekSun" class="btn-check" value="0" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekSun">Sun</label>
                                            <input type="checkbox" id="eventDaysOfWeekMon" class="btn-check" value="1" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekMon">Mon</label>
                                            <input type="checkbox" id="eventDaysOfWeekTue" class="btn-check" value="2" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekTue">Tue</label>
                                            <input type="checkbox" id="eventDaysOfWeekWed" class="btn-check" value="3" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekWed">Wed</label>
                                            <input type="checkbox" id="eventDaysOfWeekThu" class="btn-check" value="4" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekThu">Thu</label>
                                            <input type="checkbox" id="eventDaysOfWeekFri" class="btn-check" value="5" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekFri">Fri</label>
                                            <input type="checkbox" id="eventDaysOfWeekSat" class="btn-check" value="6" autocomplete="off" />
                                            <label class="btn btn-outline-primary" for="eventDaysOfWeekSat">Sat</label>
                                        </div>
                                        <input type="hidden" id="eventDaysOfWeek" name="daysOfWeek" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventStartTime">Start Time</label>
                                        <input type="time" class="form-control" id="eventStartTime" name="startTime" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventEndTime">End Time</label>
                                        <input type="time" class="form-control" id="eventEndTime" name="endTime" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventStartRecur">Recurrence Start</label>
                                        <input type="datetime-local" class="form-control" id="eventStartRecur" name="startRecur" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventEndRecur">Recurrence End</label>
                                        <input type="datetime-local" class="form-control" id="eventEndRecur" name="endRecur" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventInteractive">Interactive</label>
                                        <select class="form-control" id="eventInteractive" name="interactive">
                                            <option value="">--</option>
                                            <option value="true">Yes</option>
                                            <option value="false">No</option>
                                        </select>
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventClassName">Class Name</label>
                                        <input type="text" class="form-control" id="eventClassName" name="className" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventClassNames">Class Names (comma separated)</label>
                                        <input type="text" class="form-control" id="eventClassNames" name="classNames" placeholder="e.g. myclass1,myclass2" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventEditable">Editable</label>
                                        <select class="form-control" id="eventEditable" name="editable">
                                            <option value="">--</option>
                                            <option value="true">Yes</option>
                                            <option value="false">No</option>
                                        </select>
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventStartEditable">Start Editable</label>
                                        <select class="form-control" id="eventStartEditable" name="startEditable">
                                            <option value="">--</option>

                                            <option value="false">No</option>

                                    <div class="form-group mb-2">

                                    </div>
                                    <div class="form-group mb-2">

                                            <option value="false">No</option>

                                    </div>
                                    <div class="form-group mb-2">

                                    </div>
                                    <div class="form-group mb-2">

                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventOverlap">Overlap</label>
                                        <select class="form-control" id="eventOverlap" name="overlap">
                                            <option value="">--</option>
                                            <option value="true">Yes</option>
                                            <option value="false">No</option>
                                        </select>
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventConstraint">Constraint</label>
                                        <input type="text" class="form-control" id="eventConstraint" name="constraint" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventRrule">RRule</label>
                                        <input type="text" class="form-control" id="eventRrule" name="rrule" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventDuration">Duration</label>
                                        <input type="text" class="form-control" id="eventDuration" name="duration" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventBackgroundColor">Background Color</label>
                                        <input type="color" class="form-control" id="eventBackgroundColor" name="backgroundColor" />
                                    </div>
                                    <div class="form-group mb-2">
                                        <label for="eventBorderColor">Border Color</label>
                                        <input type="color" class="form-control" id="eventBorderColor" name="borderColor" />
                                    </div>
                                    <div class="form-group mb-2">

                                        <input type="color" class="form-control" id="eventTextColor" name="textColor" />
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button -->
                        </form>
                    </div>

                    <!-- Modal Footer -->
                    <div class="modal-footer">
                        <button type="submit" form="createEventForm" id="createEventSubmit" class="btn btn-primary">Create Event</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>

        <script>
            // Days of week checkboxes to hidden input
            $(function () {
                $('#daysOfWeekButtons input[type="checkbox"]').on('change', function () {
                    const selected = $('#daysOfWeekButtons input[type="checkbox"]:checked')
                        .map(function () {
                            return this.value;
                        })
                        .get();
                    $('#eventDaysOfWeek').val(selected.join(','));
                });
            });

            // Event form submission
            document.getElementById('createEventForm').addEventListener('submit', async function (event) {
                event.preventDefault();
                const form = event.target;
                submitEventForm(
                    form,
                    function (result) {
                        alert('Event created successfully!');
                        if (typeof loadEvents === 'function') loadEvents();
                        const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('createEventModal'));
                        modal.hide();
                        form.reset();
                    },
                    function (error) {
                        alert('Error: ' + (error.error || error.errorMessage || 'Unknown error'));
                    }
                );
            });
        </script>

        <!-- Image Upload -->
        <div class="card loginRequired">
            <div class="card-header">
                <h1 class="card-title loginRequired">Image Upload</h1>
            </div>
            <div class="card-body">
                <form id="imageUploadForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="imageFile">Image File</label>
                        <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*" />
                    </div>
                    <div class="form-group">
                        <label for="imageName">Image Name</label>
                        <input type="text" class="form-control" id="imageName" name="imageName" />
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="imageUploadBtn" class="btn btn-primary">Upload Image</button>

                    <div class="loginRequired" id="imageChanger">
                        <div clas="card">
                            <div class="card-header">
                                <h1 class="card-title loginRequired">Index</h1>
                            </div>
                            <div class="card-body">
                                <div id="indexSplashImage">
                                    <img src="https://api.pioneerrocketry.com/image/home2.jpg" class="img-fluid img-small rounded mx-auto" />
                                    <input type="file" class="form-control" id="indexSplashImageFile" name="indexSplashImageFile" accept="image/*" />
                                    <button class="btn btn-primary" id="indexSplashImageUploadBtn" disabled>Upload Image</button>
                                    <script>
                                        $('#indexSplashImageFile').on('change', function () {
                                            $('#indexSplashImageUploadBtn').addClass('btn-danger').removeClass('btn-primary').prop('disabled', false);
                                        });
                                        $('#indexSplashImageUploadBtn').on('click', function () {
                                            const formData = new FormData();
                                            const file = $('#indexSplashImageFile').prop('files')[0];

                                            if (!file) {
                                                alert('Please select a file before uploading.');
                                                return;
                                            }

                                            formData.append('file', file); // Append the file to the form data
                                            formData.append('name', 'home2.jpg');
                                            // Include any additional data if needed
                                            formData.append('user', window.user);

                                            // Make the AJAX request
                                            $.ajax({
                                                type: 'POST',
                                                url: 'https://api.pioneerrocketry.com/image/replace/home2.jpg',
                                                data: formData,
                                                processData: false, // Required for FormData
                                                contentType: false, // Required for FormData

                                                success: function (response) {
                                                    alert('Image uploaded successfully!');
                                                    console.log(response);
                                                },
                                                error: function (error) {
                                                    alert('Error uploading image.');
                                                    console.error(error);
                                                },
                                            });
                                        });
                                    </script>
                                </div>
                            </div>
                        </div>
                    </div>
                    <script>
                        document.getElementById('imageUploadForm').addEventListener('submit', function (event) {
                            event.preventDefault();

                            const imageName = document.getElementById('imageName').value;
                            const imageFile = document.getElementById('imageFile').files[0];

                            // Create a new FormData object to hold the form data
                            const formData = new FormData();
                            formData.append('imageFile', imageFile);

                            // Define the headers you want to include
                            const headers = {
                                token: window.user.getToken(),
                                name: window.user.getName(),
                                email: window.user.getEmail(),
                                id: window.user.getId(),
                            };

                            // Create a new XMLHttpRequest to send the form data
                            const xhr = new XMLHttpRequest();
                            xhr.open('POST', `https://api.pioneerrocketry.com/image/upload/${encodeURIComponent(imageName)}`, true);

                            // Set custom headers
                            for (const key in headers) {
                                xhr.setRequestHeader(key, headers[key]);
                            }

                            // Handle the response
                            xhr.onload = function () {
                                if (xhr.status === 200) {
                                    alert('Image uploaded successfully!');
                                } else {
                                    alert('Upload failed.\nStatus: ' + xhr.status + '\nError: ' + JSON.parse(xhr.response)['error']);
                                }
                            };

                            // Send the form data
                            xhr.send(formData);
                        });
                    </script>
                </form>
            </div>
        </div>
