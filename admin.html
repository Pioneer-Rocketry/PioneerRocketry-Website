<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./scripts/tools.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.dropotron.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>
    <script> 
        function loadUsers(){
            if (window.user != null||window.user != undefined||window.user != ""){
                const settings = {
                    "url": "https://api.pioneerrocketry.com/admin/getAllUsers",
                    "method": "POST",
                    "data": {"User" : window.user}
                  };
                  
                  $.ajax(settings).done(function (response) {
                    console.log(response);
                    let table = $("<table>").addClass("table table-hover placeholder-glow placeholder-sm");
                    for(const user of response.results.users){
                        //create a table that will show the user info. in the flags field have a dropsown with 1-10 flags using jquery

                        let row = $("<tr>").appendTo(table);
                        let cell = $("<td>").appendTo(row);
                        let cell2 = $("<td>").appendTo(row);
                        let cell3 = $("<td>").appendTo(row);
                        let cell4 = $("<td>").appendTo(row);
                        let cell5 = $("<td>").appendTo(row);

                        cell.text(user.name);
                        cell2.text(user.email);
                        cell3.text(user.id);
                        cell4.append($("<select>").attr("id", user.id+"flag").addClass("form-select").append(
                            $("<option>").text("Viewer").val(0),
                            $("<option>").text("Member").val(1),
                            $("<option>").text("Helper").val(2),
                            $("<option>").text("Admin").val(3),
                            ));
                        //select the given flag 
                        cell4.children("select").find("option[value='"+user.flags+"']").attr("selected", true);
                        cell4.children("select").change(function(){
                            $("#"+user.id+"flag").val($(this).val());
                            if($(this).val() == user.flags){
                                $("#"+user.id+"button").attr("disabled", true);
                            }else{
                                $("#"+user.id+"button").attr("disabled", false);
                            }
                        })
                        cell5.append(
                            "<button id='"+user.id+"button' class='btn btn-primary' onclick='changeUser("+user.id+", "+$("#"+user.id+"flag").val()+", "+user.name+", "+user.email+")'>Change User</button>")
                    }

                  });
            }
        }
        function changeUser(id,flags,name,email){
            $.ajax({
                url: "https://api.pioneerrocketry.com/admin/changeUser",
                type: "POST",
                data: JSON.stringify(
                    {
                    "ChangeUser":{
                        id: id,
                        flags: flags,
                        name: name,
                        email: email
                    }
                }
                ),
                }).done(function (response) {
                    
                })
                .fail(function (response) {
                    console.log(response);}
                    )
            
        }
    </script>
</head>

<body>
    <div id="g_id_onload" data-client_id="663378314498-3g2pd0cjt832jjv09i16k9brf8jb8n0p.apps.googleusercontent.com"

        data-itp_support="true">
    </div>

        data-shape="rectangular" data-logo_alignment="left">
    </div>
    <h1>User Management</h1>
    <div id="users"></div>

    <button class="btn btn-primary hide" onclick="loadUsers()">Load Users</button>
    <script>

    </script>

    <div id="events"></div>
</body>

</html>
