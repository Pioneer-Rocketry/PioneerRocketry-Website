    <script>
        function dateTimeToUTC(localDatetime) {
            const time = new Date(localDatetime);
            return time.toISOString();
        }
        let update= false;
        $(document).ready(function () {
            $(".loginRequired").hide();
            $("#events").after(
                $("<button>")
                    .attr({
                        id: "createEventBtn",
                        type: "button",
                        class: "btn btn-primary",
                        "data-bs-toggle": "modal",
                        "data-bs-target": "#createEventModal",
                    })
                    .text("Create New Event")
                    .on("click", function () {
                        update = false;
                        event = {};
                        $("#eventTitle").val(event.title || "");
                    $("#eventDescription").val(event.description || "");
                    $("#eventStartDate").val(event.start ? formatDateForInput(event.start, event.startTime) : "");
                    $("#eventEndDate").val(event.end ? formatDateForInput(event.end, event.endTime) : "");
                    $("#eventId").val(event.id || "");
                    $("#eventGroupId").val(event.groupId || "");
                    $("#eventAllDay").val(
                        event.allDay !== null ? event.allDay.toString() : "false"
                    );

                    // Set days of the week checkboxes
                    $("#daysOfWeekButtons input[type=checkbox]").prop("checked", false);
                    if (event.daysOfWeek) {
                        event.daysOfWeek.forEach(function (day) {
                            $(`#daysOfWeekButtons input[value="${day}"]`).prop(
                                "checked",
                                true
                            );
                        });
                    }
                    $("#eventDaysOfWeek").val(
                        event.daysOfWeek ? event.daysOfWeek.join(",") : ""
                    );

                    $("#eventStartTime").val(event.startTime || "");
                    $("#eventEndTime").val(event.endTime || "");
                    $("#eventStartRecur").val(
                        event.startRecur
                            ? new Date(event.startRecur).toISOString().slice(0, 16)
                            : ""
                    );
                    $("#eventEndRecur").val(
                        event.endRecur
                            ? new Date(event.endRecur).toISOString().slice(0, 16)
                            : ""
                    );
                    $("#eventUrl").val(event.url || "");
                    $("#eventInteractive").val(
                        event.interactive !== null
                            ? event.interactive.toString()
                            : "false"
                    );
                    $("#eventClassName").val(event.className || "");
                    $("#eventClassNames").val(
                        event.classNames ? event.classNames.join(", ") : ""
                    );
                    $("#eventEditable").val(
                        event.editable !== null ? event.editable.toString() : "false"
                    );
                    $("#eventStartEditable").val(
                        event.startEditable !== null
                            ? event.startEditable.toString()
                            : "false"
                    );
                    $("#eventDurationEditable").val(
                        event.durationEditable !== null
                            ? event.durationEditable.toString()
                            : "false"
                    );
                    $("#eventResourceEditable").val(
                        event.resourceEditable !== null
                            ? event.resourceEditable.toString()
                            : "false"
                    );
                    $("#eventResourceId").val(event.resourceId || "");
                    $("#eventResourceIds").val(
                        event.resourceIds ? event.resourceIds.join(", ") : ""
                    );
                    $("#eventDisplay").val(event.display || "");
                    $("#eventOverlap").val(
                        event.overlap !== null ? event.overlap.toString() : "false"
                    );
                    $("#eventConstraint").val(event.constraint || "");
                    $("#eventColor").val(event.color || "");
                    $("#eventBackgroundColor").val(event.backgroundColor || "");
                    $("#eventBorderColor").val(event.borderColor || "");
                    $("#eventTextColor").val(event.textColor || "");
                    $("#eventRrule").val(event.rrule || "");
                    $("#eventDuration").val(event.duration || "");

                    // Change the submit button text
                    $("#createEventSubmit").text("Update Event");
                    })
                    .hide()
            );
            document
                .getElementById("createEventSubmit")
                .addEventListener("click", async function (event) {
                    event.preventDefault(); // Prevent default form submission
                    console.log("Form submitted");

                    const formData = new FormData(
                        document.getElementById("createEventForm")
                    );

                    // Utility function to add values to an object if they are valid
                    const addIfValid = (
                        obj,
                        key,
                        value,
                        condition = value !== null && value !== undefined && value !== ""
                    ) => {
                        if (condition) {
                            obj[key] = value;
                        }
                    };

                    // Convert comma-separated daysOfWeek to an array of integers
                    function parseDaysOfWeek() {
                        let selectedDaysOfWeek = [];
                        $("#daysOfWeekButtons")
                            .find("input[type=checkbox]")
                            .each(function () {
                                if ($(this).prop("checked")) {
                                    selectedDaysOfWeek.push($(this).val());
                                }
                            });
                        if (selectedDaysOfWeek.length !== 0) {
                            $("#eventDaysOfWeek").val(selectedDaysOfWeek.join(","));
                        }

                        return selectedDaysOfWeek;
                    }

                    // Gather basic event data
                    const basicEventData = {};
                    addIfValid(basicEventData, "title", formData.get("eventTitle"));
                    addIfValid(
                        basicEventData,
                        "start",
                        dateTimeToUTC(formData.get("eventStartDate"))
                    );
                    addIfValid(
                        basicEventData,
                        "end",
                        dateTimeToUTC(formData.get("eventEndDate"))
                    );
                    addIfValid(
                        basicEventData,
                        "description",
                        formData.get("eventDescription")
                    );

                    // Gather advanced event data
                    const advancedEventData = {};

                    // Add advanced fields
                    const advancedFields = [
                        { key: "id", value: formData.get("eventId") },
                        { key: "groupId", value: formData.get("eventGroupId") },
                        { key: "allDay", value: formData.get("eventAllDay") === "true" },
                        {
                            key: "daysOfWeek",
                            value: parseDaysOfWeek(),
                        }, // Adjusted to parse daysOfWeek correctly
                        { key: "startTime", value: formData.get("eventStartTime") },
                        { key: "endTime", value: formData.get("eventEndTime") },
                        { key: "startRecur", value: formData.get("eventStartRecur") },
                        { key: "endRecur", value: formData.get("eventEndRecur") },
                        { key: "url", value: formData.get("eventUrl") },
                        {
                            key: "interactive",
                            value: formData.get("eventInteractive") === "true",
                        },
                        { key: "className", value: formData.get("eventClassName") },
                        { key: "classNames", value: formData.get("eventClassNames") },
                        {
                            key: "editable",
                            value: formData.get("eventEditable") === "true",
                        },
                        {
                            key: "startEditable",
                            value: formData.get("eventStartEditable") === "true",
                        },
                        {
                            key: "durationEditable",
                            value: formData.get("eventDurationEditable") === "true",
                        },
                        {
                            key: "resourceEditable",
                            value: formData.get("eventResourceEditable") === "true",
                        },
                        { key: "resourceId", value: formData.get("eventResourceId") },
                        { key: "resourceIds", value: formData.get("eventResourceIds") },
                        { key: "display", value: formData.get("eventDisplay") },
                        {
                            key: "overlap",
                            value: formData.get("eventOverlap") === "true",
                        },
                        { key: "constraint", value: formData.get("eventConstraint") },
                        {
                            key: "color",
                            value: formData.get("eventColor"),
                            condition: formData.get("eventColor") !== "#000000",
                        },
                        {
                            key: "backgroundColor",
                            value: formData.get("eventBackgroundColor"),
                            condition: formData.get("eventBackgroundColor") !== "#000000",
                        },
                        {
                            key: "borderColor",
                            value: formData.get("eventBorderColor"),
                            condition: formData.get("eventBorderColor") !== "#000000",
                        },
                        {
                            key: "textColor",
                            value: formData.get("eventTextColor"),
                            condition: formData.get("eventTextColor") !== "#000000",
                        },
                        { key: "rrule", value: formData.get("eventRrule") },
                        { key: "duration", value: formData.get("eventDuration") },
                    ];

                    // Add each advanced field if valid
                    advancedFields.forEach(({ key, value, condition = true }) =>
                        addIfValid(advancedEventData, key, value, condition)
                    );

                    // Combine basic and advanced data into a single object
                    const eventData = {
                        CalendarEvent: { ...basicEventData, ...advancedEventData },
                        User: window.user,
                    };

                    console.log(eventData);

                    try {

                        // Send data to the backend for insertion into the database
                        if(update== true){
                            const response = await fetch(
                            "https://api.pioneerrocketry.com/calendar/updateEvent",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify(eventData),
                            }
                        );
                        }else{
                            const response = await fetch(
                            "https://api.pioneerrocketry.com/calendar/createEvent",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                                body: JSON.stringify(eventData),
                            }
                        );
                        }
                        

                        if (!response.ok) {
                            throw new Error("Failed to insert event");
                        }

                        // Handle success response
                        console.log("New Event Inserted Successfully");

                        // Optionally, close the modal or reset the form
                        $("#createEventModal").modal("hide");
                        $("#eventData .toast-body").html("Event created successfully");
                        $("#eventData").toast("show");
                    } catch (error) {
                        // Handle error
                        console.error("Error inserting event:", error.message);
                        // Optionally, display an error message to the user
                    }
                });
        });
        function formatDateForInput(dateString, timeString) {
            let date = new Date(dateString);

            // Split time into hours and minutes
            let [hours, minutes] = timeString.split(':');

            // Set the time part manually to the date object
            date.setHours(hours - 5);
            date.setMinutes(minutes);

            // Return the formatted string for the input field (yyyy-MM-ddTHH:mm)
            return date.toISOString().slice(0, 16);
        }
        async function loadUsers() {
            if (
                window.user != null ||
                window.user != undefined ||
                window.user != ""
            ) {
                const settings = {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ User: window.user }),
                };
                let response = await fetch(
                    "https://api.pioneerrocketry.com/admin/getAllUsers",
                    settings
                );
                if (response.ok) {
                    createUserTable(await response.json());
                }
            }
        }
        async function loadEvents() {
            let data = await fetch(
                "https://api.pioneerrocketry.com/calendar/getAllEvents",
                {
                    method: "GET",
                }
            );
            createEventTable(await data.json());
        }
        async function changeUser(id, flags, name, email) {
            try {
                const response = await fetch(
                    "https://api.pioneerrocketry.com/admin/changeUser",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            ChangeUser: {
                                id: id,
                                flags: flags,
                                name: name,
                                email: email,
                            },
                            User: window.user,
                        }),
                    }
                );

                const data = await response.json();
                createUserTable(data);
                console.log(data);
            } catch (error) {
                console.log(error);
            }
        }
        function createUserTable(response) {
            let table = $("<table>").addClass(
                "table table-hover placeholder-glow placeholder-sm"
            );

            console.log(response);

            for (const user of response.result.users) {
                let row = $("<tr>").appendTo(table);
                let cellName = $("<td>").text(user.name).appendTo(row);
                let cellEmail = $("<td>").text(user.email).appendTo(row);
                let cellId = $("<td>").text(user.id).appendTo(row);

                // Create the dropdown for flags
                let flagSelect = $("<select>")
                    .attr("id", `${user.id}flag`)
                    .addClass("form-select")
                    .append(
                        $("<option>").text("Viewer").val(0),
                        $("<option>").text("Member").val(1),
                        $("<option>").text("Helper").val(2),
                        $("<option>").text("Admin").val(3)
                    )
                    .val(user.flags); // Set the selected option based on the user's current flag

                let cellFlags = $("<td>").append(flagSelect).appendTo(row);

                // Create the Change User button
                let changeButton = $("<button>")
                    .attr("id", `${user.id}button`)
                    .addClass("btn btn-primary")
                    .text("Change User")
                    .prop("disabled", true) // Initially disabled
                    .appendTo($("<td>").appendTo(row));

                // Enable/Disable button based on flag selection
                flagSelect.change(function () {
                    if ($(this).val() == user.flags) {
                        changeButton.prop("disabled", true);
                    } else {
                        changeButton.prop("disabled", false);
                    }
                });

                // Handle the Change User button click
                changeButton.click(function () {
                    changeUser(user.id, flagSelect.val(), user.name, user.email);
                });
            }

            // Clear previous table and append the new one
            $("#users").empty().append(table);
        }
        function createEventTable(response) {
            let table = $("<table>").addClass(
                "table table-hover placeholder-glow placeholder-sm"
            );
            //there needs to be a form for editing an event.

            for (const event of response.result.events) {
                let row = $("<tr>").appendTo(table);

                let cellName = $("<td>").text(event.title).appendTo(row);
                let cellDescription = $("<td>").text(event.description).appendTo(row);
                let cellStart = $("<td>").text(event.start).appendTo(row);
                let cellEnd = $("<td>").text(event.end).appendTo(row);
                let buttonCell = $("<td>").appendTo(row);

                let editButton = $("<button>")
                    .attr("id", `${event.id}button`)
                    .addClass("btn btn-primary")
                    .text("Edit Event")
                    .appendTo(buttonCell);
                editButton.click(function () {
                    update = true;
                    // Get the event object (assuming it's passed to this function)

                    // Set the modal fields with the event data
                    $("#eventTitle").val(event.title || "");
                    $("#eventDescription").val(event.description || "");
                    $("#eventStartDate").val(event.start ? formatDateForInput(event.start, event.startTime) : "");
                    $("#eventEndDate").val(event.end ? formatDateForInput(event.end, event.endTime) : "");
                    $("#eventId").val(event.id || "");
                    $("#eventGroupId").val(event.groupId || "");
                    $("#eventAllDay").val(
                        event.allDay !== null ? event.allDay.toString() : "false"
                    );

                    // Set days of the week checkboxes
                    $("#daysOfWeekButtons input[type=checkbox]").prop("checked", false);
                    if (event.daysOfWeek) {
                        event.daysOfWeek.forEach(function (day) {
                            $(`#daysOfWeekButtons input[value="${day}"]`).prop(
                                "checked",
                                true
                            );
                        });
                    }
                    $("#eventDaysOfWeek").val(
                        event.daysOfWeek ? event.daysOfWeek.join(",") : ""
                    );

                    $("#eventStartTime").val(event.startTime || "");
                    $("#eventEndTime").val(event.endTime || "");
                    $("#eventStartRecur").val(
                        event.startRecur
                            ? new Date(event.startRecur).toISOString().slice(0, 16)
                            : ""
                    );
                    $("#eventEndRecur").val(
                        event.endRecur
                            ? new Date(event.endRecur).toISOString().slice(0, 16)
                            : ""
                    );
                    $("#eventUrl").val(event.url || "");
                    $("#eventInteractive").val(
                        event.interactive !== null
                            ? event.interactive.toString()
                            : "false"
                    );
                    $("#eventClassName").val(event.className || "");
                    $("#eventClassNames").val(
                        event.classNames ? event.classNames.join(", ") : ""
                    );
                    $("#eventEditable").val(
                        event.editable !== null ? event.editable.toString() : "false"
                    );
                    $("#eventStartEditable").val(
                        event.startEditable !== null
                            ? event.startEditable.toString()
                            : "false"
                    );
                    $("#eventDurationEditable").val(
                        event.durationEditable !== null
                            ? event.durationEditable.toString()
                            : "false"
                    );
                    $("#eventResourceEditable").val(
                        event.resourceEditable !== null
                            ? event.resourceEditable.toString()
                            : "false"
                    );
                    $("#eventResourceId").val(event.resourceId || "");
                    $("#eventResourceIds").val(
                        event.resourceIds ? event.resourceIds.join(", ") : ""
                    );
                    $("#eventDisplay").val(event.display || "");
                    $("#eventOverlap").val(
                        event.overlap !== null ? event.overlap.toString() : "false"
                    );
                    $("#eventConstraint").val(event.constraint || "");
                    $("#eventColor").val(event.color || "");
                    $("#eventBackgroundColor").val(event.backgroundColor || "");
                    $("#eventBorderColor").val(event.borderColor || "");
                    $("#eventTextColor").val(event.textColor || "");
                    $("#eventRrule").val(event.rrule || "");
                    $("#eventDuration").val(event.duration || "");

                    // Change the submit button text
                    $("#createEventSubmit").text("Update Event");

                    // Show the modal
                    $("#createEventModal").modal("show");
                });

                let deleteButton = $("<button>")
                    .attr("id", `${event.id}button`)
                    .addClass("btn btn-danger")
                    .text("Delete Event")
                    .appendTo(buttonCell);
                deleteButton.click(function () {
                    console.log(event);
                });
            }
            $("#events").empty().append(table);
        }
    </script>

    <div class="modal fade" id="createEventModal" tabindex="-1" aria-labelledby="createEventModalLabel"
        aria-hidden="true" data-bs-theme="dark">
        <div class="modal-dialog" data-bs-theme="dark">
            <div class="modal-content" data-bs-theme="dark">
                <!-- Modal Header -->
                <div class="modal-header" data-bs-theme="dark">
                    <h1 class="modal-title fs-5" id="exampleModalLabel" data-bs-theme="dark">
                        Create New Event
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                        data-bs-theme="dark"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body" data-bs-theme="dark">

                                required />

                        <!-- Advanced Settings Dropdown -->

                                aria-controls="advancedSettingsCollapse">
                                Advanced Settings
                            </button>
                        </div>

                        <!-- Collapsible Advanced Settings -->
                        <div class="collapse" id="advancedSettingsCollapse">
                            <div class="card card-body">
                                <!-- Advanced Settings Fields -->
                                <div class="form-group">
                                    <label for="eventId">Event ID</label>
                                    <input type="text" class="form-control" id="eventId" name="eventId" />
                                </div>

                                <div class="form-group">
                                    <label for="eventGroupId">Group ID</label>
                                    <input type="text" class="form-control" id="eventGroupId" name="eventGroupId" />
                                </div>

                                <div class="form-group">
                                    <label for="eventAllDay">All Day</label>
                                    <select class="form-control" id="eventAllDay" name="eventAllDay">
                                        <option value="true">True</option>
                                        <option value="false" selected>False</option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label for="eventDaysOfWeek">Select Days of the Week</label>
                                    <div id="daysOfWeekButtons" class="btn-group btn-group-toggle"
                                        data-bs-toggle="buttons">
                                        <input type="checkbox" id="eventDaysOfWeekSun" class="btn-check" value="0" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekSun">
                                            Sun
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekMon" class="btn-check" value="1" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekMon">
                                            Mon
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekTue" class="btn-check" value="2" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekTue">
                                            Tue
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekWed" class="btn-check" value="3" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekWed">
                                            Wed
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekThu" class="btn-check" value="4" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekThu">
                                            Thu
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekFri" class="btn-check" value="5" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekFri">
                                            Fri
                                        </label>
                                        <input type="checkbox" id="eventDaysOfWeekSat" class="btn-check" value="6" />
                                        <label class="btn btn-outline-primary" for="eventDaysOfWeekSat">
                                            Sat
                                        </label>
                                    </div>
                                    <input type="hidden" id="eventDaysOfWeek" name="eventDaysOfWeek" />
                                </div>

                                <div class="form-group">
                                    <label for="eventStartTime">Start Time</label>
                                    <input type="time" class="form-control" id="eventStartTime" name="eventStartTime" />
                                </div>

    <div class="card loginRequired">
        <div class="card-header">
        <h1 class=" card-title loginRequired">Image Upload</h1>
        </div>
        <div class="card-body">
        <div class="loginRequired" id="events"></div>
        </div>

        <form id="imageUploadForm">
            <div class="form-group">
                <label for="imageFile">Image File</label>
                <input type="file" class="form-control" id="imageFile" name="imageFile" accept="image/*"/>
            </div>
            <div class="form-group">
                <label for="imageName">Image Name</label>
                <input type="text" class="form-control" id="imageName" name="imageName" />
            </div>

            <!-- Submit Button -->
            <button type="submit" id="imageUploadBtn" class="btn btn-primary">
                Upload Image
            </button>

            <script>
                document.getElementById('imageUploadForm').addEventListener('submit', function(event) {
                    event.preventDefault();

                    const imageName = document.getElementById('imageName').value;
                    const imageFile = document.getElementById('imageFile').files[0];

                    // Create a new FormData object to hold the form data
                    const formData = new FormData();
                    formData.append('imageFile', imageFile);

                    // Define the headers you want to include
                    const headers = {
                        'token': window.user.getToken(),
                        'name':  window.user.getName(),
                        'email': window.user.getEmail(),
                        'id':    window.user.getId()
                    };

                    // Create a new XMLHttpRequest to send the form data
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', `https://api.pioneerrocketry.com/image/upload/${encodeURIComponent(imageName)}`, true);

                    // Set custom headers
                    for (const key in headers) {
                        xhr.setRequestHeader(key, headers[key]);
                    }

                    // Handle the response
                    xhr.onload = function() {
                        if (xhr.status === 200) {
                            alert('Image uploaded successfully!');
                        } else {
                            alert('Upload failed. Status: ' + xhr.status);
                        }
                    };

                    // Send the form data
                    xhr.send(formData);
                });
            </script>
      </div>
